name: update-archive
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/archive.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/archive.json
          git diff --cached --quiet || (git commit -m "update archive" && git push)
